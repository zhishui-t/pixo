[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixo"
version = "0.1.0"
description = "Pixo render / vision / meta Python engine"
readme = "src/pixo/render/README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
dependencies = [
    "rawpy>=0.23",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "exifread>=3.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
pixo-render = []
pixo-vision = [
    "onnxruntime>=1.16",
]
pixo-vision-models = [
    "torch>=2.0",
    "transformers>=4.30",
]
pixo-meta = []
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pixo*", "render*"]
exclude = ["render.tests*", "pixo.render.tests*"]

[tool.setuptools.package-data]
"pixo.render" = [
    "bench/*.json",
    "_native/*.dll",
    "_native/*.so",
]
"pixo.agent" = [
    "prompts/*.md",
]

[tool.setuptools.data-files]
"configs/styles" = ["configs/styles/*.json"]
"resources/dcp" = ["resources/dcp/*.dcp"]
"resources/camera_profiles" = ["resources/camera_profiles/*.json"]
"resources/models" = ["resources/models/*"]
"data/golden" = ["data/golden/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: 需真实 NEF 数据的端到端测试 (无数据时 skip)",
    "regression: 金样本/回归测试（数据存在时执行，缺失时 skip）",
    "gate: pixo.render 功能门禁测试（失败阻塞合并）",
    "gate_e2e: 需真实 NEF 的门禁 A-B（RAW_PATH 缺省时 skip）",
]
