[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixo"
version = "0.1.0"
description = "Pixo render / vision / meta Python engine"
readme = "pixo/render/README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
dependencies = [
    "rawpy>=0.23",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "exifread>=3.5",
]

[project.optional-dependencies]
pixo-render = []
pixo-vision = []
pixo-meta = []
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pixo*", "render*"]
exclude = ["render.tests*", "pixo.render.tests*"]

[tool.setuptools.package-data]
"pixo.render" = [
    "profiles/*.dcp",
    "presets/*.json",
    "calibration_data/*.json",
    "bench/*.json",
    "_native/*.dll",
    "_native/*.so",
]
